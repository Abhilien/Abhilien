[project]
name = "persona-studio"
version = "0.1.0"
description = "An AI agent that designs, plans, renders and runs faceless / AI-character Instagram channels."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
