name: Waypoint

on:
  push:
    paths: ['waypoint/**', '.github/workflows/waypoint.yml']
  pull_request:
    paths: ['waypoint/**', '.github/workflows/waypoint.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: waypoint

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: waypoint/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: waypoint/playwright-report
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: waypoint/dist

  # Publishes the app to GitHub Pages on pushes to main.
  # One-time setup: Settings → Pages → Source: "GitHub Actions".
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
