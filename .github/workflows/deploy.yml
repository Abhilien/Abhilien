# Publish the app to GitHub Pages.
#
# Runs on every push to main, and on demand. Nothing is published unless the
# tests and the browser check below pass. The built site goes to the gh-pages
# branch, which GitHub Pages serves at abhilien.github.io/aistro/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: 'Path the app is served from. "/" for a user site (abhilien.github.io), "/<repo>/" for a project site.'
        required: true
        default: '/aistro/'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_BASE: ${{ inputs.base || '/aistro/' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test --workspaces --if-present

      # 550,000 villages, 13 MB. Too large to commit, so it is rebuilt here and
      # cached against the dump's weekly refresh.
      - name: Cache the GeoNames dump
        uses: actions/cache@v4
        with:
          path: .geonames
          key: geonames-${{ hashFiles('scripts/build-places.mjs') }}-${{ github.run_id }}
          restore-keys: geonames-${{ hashFiles('scripts/build-places.mjs') }}-

      - name: Build the full place database
        run: |
          node scripts/fetch-geonames.mjs
          node scripts/build-places.mjs .geonames/IN.txt .geonames/admin1CodesASCII.txt

      - name: Build
        run: npm run build

      # The last gate before anything is public. Serves the artifact exactly as
      # a host would and drives it in a browser: a wrong base path or a worker
      # that fails to register produces a build that looks fine in dist/ and is
      # broken for every user.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the built app
        run: node scripts/verify-deployment.mjs apps/web/dist "$APP_BASE"

      - run: touch apps/web/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/dist
