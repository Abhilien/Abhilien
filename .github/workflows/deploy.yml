# Publish the app to GitHub Pages.
#
# Manual by design. Publishing is an outward-facing act and this repository is
# also a GitHub profile, so a push should never deploy on its own — run this
# workflow when you actually want the live site to change.
#
# Before the first run, in Settings → Pages, set Source to "GitHub Actions".
name: Deploy

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Path the app is served from. "/" for a user site (abhilien.github.io), "/<repo>/" for a project site.'
        required: true
        default: '/'

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test --workspaces --if-present

      # 550,000 villages, 13 MB. Too large to commit, so it is rebuilt here and
      # cached against the dump's weekly refresh.
      - name: Cache the GeoNames dump
        uses: actions/cache@v4
        with:
          path: .geonames
          key: geonames-${{ hashFiles('scripts/build-places.mjs') }}-${{ github.run_id }}
          restore-keys: geonames-${{ hashFiles('scripts/build-places.mjs') }}-

      - name: Build the full place database
        run: |
          node scripts/fetch-geonames.mjs
          node scripts/build-places.mjs .geonames/IN.txt .geonames/admin1CodesASCII.txt

      - name: Build
        run: npm run build
        env:
          APP_BASE: ${{ inputs.base }}

      # The last gate before anything is public. Serves the artifact exactly as
      # a host would and drives it in a browser: a wrong base path or a worker
      # that fails to register produces a build that looks fine in dist/ and is
      # broken for every user.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the built app
        run: node scripts/verify-deployment.mjs apps/web/dist "${{ inputs.base }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: pages
        uses: actions/deploy-pages@v4
